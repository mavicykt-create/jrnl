<!DOCTYPE html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<title>Журнал работ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231C1C1E'/><path d='M8 16.5l5 5 11-11' stroke='%23F0C220' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">

<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --sec:#8E8E93; --sec2:#AEAEB2;
  --sep:#E5E5EA; --fill:#F7F7FA;
  --tint:#007AFF; --red:#FF3B30; --orange:#FF9500; --green:#34C759; --brand:#F0C220;
  --r:14px;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sys);font-size:15px;line-height:1.42;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--tint);outline-offset:2px;border-radius:6px}

/* ---------- ВХОД ---------- */
#gate{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;justify-content:center;align-items:center;padding:28px 22px calc(28px + var(--safe-b));z-index:60;overflow:auto}
#gate.on{display:flex}
.gcard{width:100%;max-width:360px}
.gmark{width:56px;height:56px;border-radius:14px;background:#1C1C1E;display:grid;place-items:center;margin:0 auto 20px}
.gmark svg{width:30px;height:30px}
.gcard h1{font-size:27px;font-weight:700;letter-spacing:-.03em;text-align:center;margin:0 0 6px}
.gcard .sub{text-align:center;color:var(--sec);font-size:14px;margin:0 0 30px}
.glabel{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--sec);margin:0 0 9px 4px}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:24px}
.person{background:var(--card);border:1.5px solid transparent;border-radius:var(--r);padding:15px 4px 12px;display:grid;justify-items:center;gap:9px;transition:border-color .15s,transform .1s}
.person:active{transform:scale(.97)}
.person span{font-size:13.5px;font-weight:500}
.person.on{border-color:var(--tint)}
.pinrow{display:flex;gap:9px}
.pinrow input{flex:1;background:var(--card);border:1.5px solid transparent;border-radius:var(--r);padding:15px;font-size:19px;letter-spacing:.35em;text-align:center}
.pinrow input:focus{outline:none;border-color:var(--tint)}
.pinrow button{background:var(--tint);border:0;border-radius:var(--r);color:#fff;font-size:16px;font-weight:600;padding:0 22px}
.pinrow button:active{opacity:.75}
.gerr{color:var(--red);font-size:13.5px;text-align:center;min-height:20px;margin-top:14px}

/* ---------- ШАПКА ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(242,242,247,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.topin{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:-.03em}
.logo .mark{width:26px;height:26px;border-radius:7px;background:#1C1C1E;display:grid;place-items:center;flex:none}
.logo .mark svg{width:15px;height:15px}
.top .sp{flex:1}
.iconbtn{width:38px;height:38px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--tint)}
.iconbtn:active{background:rgba(0,0,0,.06)}
.iconbtn svg{width:21px;height:21px}
.ava{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;width:30px;height:30px;font-size:13px}

.wrap{max-width:980px;margin:0 auto;padding:14px 16px calc(96px + var(--safe-b))}

/* ---------- прогресс ---------- */
.prog{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.prog .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.prog .name{font-size:16px;font-weight:600;letter-spacing:-.02em}
.prog .cnt{font-size:13px;color:var(--sec);white-space:nowrap;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:99px;background:var(--sep);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--green);width:0;transition:width .35s ease}
.prog .late{color:var(--red);font-weight:600}

/* ---------- вкладки объектов ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--card);border:0;border-radius:99px;padding:9px 15px;font-size:14.5px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab b{font-size:12px;font-weight:600;color:var(--sec);background:var(--fill);border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}
.tab.on{background:var(--ink);color:#fff}
.tab.on b{background:rgba(255,255,255,.22);color:#fff}
.tab.add{color:var(--tint);font-weight:500}
.tab:active{opacity:.7}

/* ---------- фильтр ---------- */
.seg{display:flex;background:rgba(118,118,128,.12);border-radius:9px;padding:2px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:7px 4px;font-size:13.5px;font-weight:500;color:var(--ink)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:600}
.sortline{display:flex;justify-content:flex-end;margin:-6px 0 12px}
.linkbtn{background:none;border:0;color:var(--tint);font-size:13.5px;padding:4px 2px}
.linkbtn.on{font-weight:600}

/* ---------- список ---------- */
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.task{border-bottom:.5px solid var(--sep)}
.task:last-child{border-bottom:0}
.trow{display:flex;align-items:flex-start;gap:11px;padding:12px 14px}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:1.6px solid var(--sec2);background:transparent;padding:0;display:grid;place-items:center;margin-top:1px;transition:background .12s,border-color .12s}
.check svg{width:14px;height:14px;color:#fff;opacity:0;transition:opacity .12s}
.task.done .check{background:var(--green);border-color:var(--green)}
.task.done .check svg{opacity:1}
.mid{flex:1;min-width:0}
.title{width:100%;border:0;background:transparent;padding:0;font-size:16px;letter-spacing:-.02em;line-height:1.3}
.title:focus{outline:none}
.task.done .title{color:var(--sec2);text-decoration:line-through}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.who{font-size:13.5px;color:var(--sec);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-peek{font-size:13.5px;color:var(--sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.sig{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sec2);white-space:nowrap}
.sig .dot{width:6px;height:6px;border-radius:50%;flex:none}

/* срок — компактная пилюля */
.duepill{position:relative;display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 10px;font-size:13px;font-weight:500;background:var(--fill);color:var(--sec);border:1px solid transparent;font-variant-numeric:tabular-nums}
.duepill svg{width:12px;height:12px;flex:none}
.duepill input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;background:transparent}
.duepill.empty{color:var(--tint);background:rgba(0,122,255,.09)}
.duepill.soon{color:#9A5B00;background:rgba(255,149,0,.15)}
.duepill.late{color:var(--red);background:rgba(255,59,48,.12)}
.task.done .duepill{opacity:.45;color:var(--sec);background:var(--fill)}

.clip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--sec);background:var(--fill);border-radius:99px;padding:4px 9px;font-weight:500}
.clip svg{width:12px;height:12px}
.chev{flex:none;width:30px;height:30px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--sec2);margin-top:-2px}
.chev svg{width:16px;height:16px;transition:transform .2s}
.task.open .chev svg{transform:rotate(90deg)}
.chev:active{background:var(--fill)}

/* ---------- раскрытая карточка ---------- */
.det{display:none;padding:2px 14px 16px 49px;border-top:.5px dashed var(--sep);margin-top:2px}
.task.open .det{display:block}
.det h4{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--sec);margin:14px 0 8px}
.det h4:first-child{margin-top:12px}
.field{width:100%;background:var(--fill);border:1px solid transparent;border-radius:11px;padding:11px 12px;font-size:15px}
.field:focus{outline:none;border-color:var(--tint);background:var(--card)}
textarea.field{resize:vertical;min-height:74px;line-height:1.4}
.files{display:flex;flex-direction:column;gap:7px;margin-bottom:9px}
.file{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:11px;padding:9px 11px}
.file .ic{width:30px;height:30px;border-radius:8px;background:var(--card);display:grid;place-items:center;flex:none;color:var(--tint)}
.file .ic svg{width:15px;height:15px}
.file .fi{flex:1;min-width:0}
.file a{display:block;color:var(--ink);text-decoration:none;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file em{font-style:normal;font-size:12px;color:var(--sec2);font-variant-numeric:tabular-nums}
.file button{border:0;background:transparent;color:var(--sec2);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.file button:active{background:rgba(0,0,0,.06);color:var(--red)}
.file button svg{width:15px;height:15px}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--sep);border-radius:11px;padding:13px;font-size:14px;color:var(--tint);background:transparent;width:100%}
.drop svg{width:16px;height:16px}
.drop.hot{border-color:var(--tint);background:rgba(0,122,255,.06)}
.det .danger{margin-top:16px;background:transparent;border:0;color:var(--red);font-size:14.5px;padding:6px 0}

.empty{background:var(--card);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--sec)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}
.footlinks{display:flex;justify-content:center;gap:18px;margin-top:18px;font-size:13.5px}

/* ---------- добавление ---------- */
.fab{position:fixed;right:18px;bottom:calc(18px + var(--safe-b));width:56px;height:56px;border-radius:50%;border:0;background:var(--tint);color:#fff;box-shadow:0 6px 20px rgba(0,122,255,.35);display:grid;place-items:center;z-index:25}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.94)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px calc(18px + var(--safe-b));transform:translateY(105%);transition:transform .26s cubic-bezier(.32,.72,0,1);box-shadow:0 -6px 30px rgba(0,0,0,.14)}
#sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:99px;background:var(--sep);margin:0 auto 14px}
#sheet h3{font-size:17px;font-weight:600;margin:0 0 14px;text-align:center}
#sheet .field{margin-bottom:9px}
#sheet .rowfields{display:flex;gap:9px}
#sheet .rowfields .field{flex:1}
.primary{width:100%;border:0;border-radius:12px;background:var(--tint);color:#fff;font-size:16px;font-weight:600;padding:14px;margin-top:6px}
.primary:active{opacity:.8}
.ghostbtn{width:100%;border:0;background:transparent;color:var(--sec);font-size:15px;padding:12px 0 2px}

/* ---------- история ---------- */
#hist{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;background:var(--bg);z-index:50;transform:translateX(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column}
#hist.on{transform:none}
.histtop{background:rgba(242,242,247,.9);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);padding:12px 14px;display:flex;align-items:center;gap:8px}
.histtop h3{flex:1;font-size:17px;font-weight:600;margin:0;text-align:center;padding-left:38px}
.histlist{overflow:auto;padding:12px 16px calc(30px + var(--safe-b));-webkit-overflow-scrolling:touch}
.entry{display:flex;gap:11px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px}
.entry .ava{width:26px;height:26px;font-size:12px}
.entry time{display:block;font-size:11.5px;color:var(--sec2);margin-bottom:3px;font-variant-numeric:tabular-nums}
.entry p{margin:0;font-size:14px;line-height:1.38}
.entry b{font-weight:600}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#veil.on{opacity:1;pointer-events:auto}

#toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translate(-50%,10px);background:rgba(28,28,30,.93);color:#fff;font-size:14px;padding:11px 18px;border-radius:99px;z-index:70;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:rgba(255,59,48,.95)}

/* ---------- десктоп ---------- */
@media (min-width:760px){
  body{font-size:15px}
  .wrap{padding-bottom:60px}
  .fab{display:none}
  #sheet{position:static;transform:none;box-shadow:none;border-radius:var(--r);padding:16px;margin-bottom:14px;background:var(--card)}
  #sheet .grab,#sheet h3,#sheet .ghostbtn{display:none}
  #sheet .form{display:flex;gap:9px;align-items:center}
  #sheet .field{margin:0}
  #sheet .rowfields{flex:none;gap:9px}
  #sheet .rowfields .field{width:170px}
  #sheet .field.task-in{flex:1}
  .primary{width:auto;margin:0;padding:12px 22px;white-space:nowrap}
  .seg{max-width:340px}
  .sortline{margin-top:-46px}
  .trow{padding:13px 16px;align-items:center}
  .mid{display:flex;align-items:center;gap:14px}
  .mid .titlewrap{flex:1;min-width:0}
  .meta{margin-top:3px}
  .det{padding-left:51px}
  .det .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<!-- ВХОД -->
<div id="gate">
  <div class="gcard">
    <div class="gmark"><svg viewBox="0 0 32 32" fill="none"><path d="M8 16.5l5 5 11-11" stroke="#F0C220" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1>Журнал работ</h1>
    <p class="sub">Гараж · Объект · Сладкая планета</p>
    <div class="glabel">Кто вы</div>
    <div class="people" id="people"></div>
    <div class="glabel">Пароль</div>
    <div class="pinrow">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••">
      <button id="enter">Войти</button>
    </div>
    <div class="gerr" id="gerr"></div>
  </div>
</div>

<!-- ШАПКА -->
<div class="top">
  <div class="topin">
    <div class="logo">
      <span class="mark"><svg viewBox="0 0 32 32" fill="none"><path d="M8 16.5l5 5 11-11" stroke="#F0C220" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Журнал работ
    </div>
    <div class="sp"></div>
    <button class="iconbtn" id="open-hist" aria-label="История">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/><path d="M12 7v5l3.5 2"/></svg>
    </button>
    <button class="iconbtn" id="me-btn" aria-label="Профиль"></button>
  </div>
</div>

<div class="wrap">
  <div class="prog">
    <div class="line"><span class="name" id="obj-name">Загружаю…</span><span class="cnt" id="obj-cnt"></span></div>
    <div class="track"><i id="bar"></i></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="sheet">
    <div class="grab"></div>
    <h3>Новая задача</h3>
    <div class="form">
      <input class="field task-in" id="f-task" type="text" placeholder="Что сделать">
      <div class="rowfields">
        <input class="field" id="f-who" type="text" placeholder="Кто делает">
        <input class="field" id="f-due" type="date" placeholder="Срок">
      </div>
      <button class="primary" id="add">Добавить</button>
    </div>
    <button class="ghostbtn" id="close-sheet">Отмена</button>
  </div>

  <div class="seg" id="seg">
    <button data-f="all" class="on">Все</button>
    <button data-f="open">В работе</button>
    <button data-f="done">Сделано</button>
  </div>
  <div class="sortline"><button class="linkbtn" id="sort">Сначала срочные</button></div>

  <div id="listbox"></div>

  <div class="footlinks">
    <button class="linkbtn" id="backup">Скачать копию</button>
    <button class="linkbtn" id="drop-obj" style="color:var(--red)">Удалить объект</button>
    <button class="linkbtn" id="exit">Выйти</button>
  </div>
</div>

<button class="fab" id="fab" aria-label="Добавить задачу">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div id="veil"></div>
<aside id="hist">
  <div class="histtop">
    <button class="iconbtn" id="close-hist" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h3>История</h3>
  </div>
  <div class="histlist" id="histlist"></div>
</aside>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const SVG = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',
  clip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2.5H7a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7.5z"/><path d="M14 2.5v5h5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};
let S = null, filter = 'all', byDue = false, picked = null;
const open = new Set();

/* ---------- сеть ---------- */
async function api(path, method, payload){
  const r = await fetch(path, {
    method: method || 'GET',
    headers: payload ? { 'Content-Type':'application/json' } : undefined,
    body: payload ? JSON.stringify(payload) : undefined
  });
  if(r.status === 401){ showGate(); throw new Error('Нужно войти'); }
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(d.error || ('Ошибка ' + r.status));
  return d;
}
async function act(path, method, payload, ok){
  try{ S = await api(path, method, payload); render(); if(ok) toast(ok); }
  catch(e){ toast(e.message, true); }
}
let tt;
function toast(msg, bad){
  const el = $('#toast');
  el.textContent = msg; el.classList.toggle('bad', !!bad); el.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2500);
}

/* ---------- вход ---------- */
const PEOPLE = [
  { id:'katya',  name:'Катя',  color:'#FF375F' },
  { id:'zhenya', name:'Женя',  color:'#007AFF' },
  { id:'arian',  name:'Ариан', color:'#30A46C' }
];
function ava(u, size){
  const d = document.createElement('div');
  d.className = 'ava';
  d.style.background = u ? u.color : '#AEAEB2';
  d.textContent = u ? u.name[0] : '?';
  if(size){ d.style.width = d.style.height = size + 'px'; d.style.fontSize = Math.round(size * .42) + 'px'; }
  return d;
}
function showGate(){ $('#gate').classList.add('on'); $('#gerr').textContent = ''; $('#pin').value = ''; }
function buildGate(){
  const box = $('#people'); box.innerHTML = '';
  PEOPLE.forEach(u => {
    const b = document.createElement('button');
    b.className = 'person';
    const s = document.createElement('span'); s.textContent = u.name;
    b.append(ava(u, 38), s);
    b.onclick = () => { picked = u.id; [...box.children].forEach(c => c.classList.toggle('on', c === b)); $('#pin').focus(); };
    box.appendChild(b);
  });
}
async function login(){
  if(!picked){ $('#gerr').textContent = 'Сначала выберите, кто вы'; return; }
  if(!$('#pin').value){ $('#gerr').textContent = 'Введите пароль'; return; }
  try{
    await api('/api/login', 'POST', { user:picked, password:$('#pin').value });
    $('#gate').classList.remove('on');
    await boot(); toast('С возвращением');
  }catch(e){ $('#gerr').textContent = e.message; $('#pin').value = ''; $('#pin').focus(); }
}
$('#enter').onclick = login;
$('#pin').addEventListener('keydown', e => { if(e.key === 'Enter') login(); });
$('#exit').onclick = async () => { await fetch('/api/logout', { method:'POST' }); picked = null; buildGate(); showGate(); };

/* ---------- даты ---------- */
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
function daysLeft(due){ return due ? Math.round((new Date(due + 'T00:00:00') - today()) / 86400000) : null; }
function dueText(due){
  if(!due) return 'Срок';
  const n = daysLeft(due);
  if(n === 0) return 'Сегодня';
  if(n === 1) return 'Завтра';
  if(n === -1) return 'Вчера';
  const d = new Date(due + 'T00:00:00');
  const base = d.getDate() + ' ' + MON[d.getMonth()];
  return d.getFullYear() !== new Date().getFullYear() ? base + ' ' + String(d.getFullYear()).slice(2) : base;
}
function when(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const t = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  return d.toDateString() === new Date().toDateString() ? t : d.getDate() + ' ' + MON[d.getMonth()] + ', ' + t;
}
const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' МБ' : Math.max(1, Math.round(n / 1024)) + ' КБ';
const userOf = id => (S && S.users.find(u => u.id === id)) || PEOPLE.find(u => u.id === id) || null;
const cur = () => S.objects.find(o => o.id === S.activeId) || S.objects[0];

/* ---------- отрисовка ---------- */
function render(){
  if(!S) return;
  if(!S.objects.some(o => o.id === S.activeId)) S.activeId = (S.objects[0] || {}).id;

  const mb = $('#me-btn'); mb.innerHTML = ''; mb.appendChild(ava(S.me, 30));

  const tabs = $('#tabs'); tabs.innerHTML = '';
  S.objects.forEach(ob => {
    const b = document.createElement('button');
    b.className = 'tab' + (ob.id === S.activeId ? ' on' : '');
    const n = document.createElement('span'); n.textContent = ob.name;
    const c = document.createElement('b'); c.textContent = ob.tasks.filter(t => !t.done).length;
    b.append(n, c);
    let timer = null;
    b.onclick = () => { S.activeId = ob.id; localStorage.setItem('tab', ob.id); render(); };
    b.ondblclick = () => renameObj(ob);
    b.addEventListener('touchstart', () => { timer = setTimeout(() => renameObj(ob), 650); }, { passive:true });
    ['touchend','touchmove','touchcancel'].forEach(ev => b.addEventListener(ev, () => clearTimeout(timer), { passive:true }));
    tabs.appendChild(b);
  });
  const plus = document.createElement('button');
  plus.className = 'tab add'; plus.textContent = '+ объект';
  plus.onclick = () => { const n = prompt('Название объекта'); if(n && n.trim()) act('/api/object', 'POST', { name:n.trim() }, 'Объект добавлен'); };
  tabs.appendChild(plus);

  const o = cur();
  const done = o.tasks.filter(t => t.done).length, all = o.tasks.length;
  const late = o.tasks.filter(t => !t.done && daysLeft(t.due) !== null && daysLeft(t.due) < 0).length;
  $('#obj-name').textContent = o.name;
  const cnt = $('#obj-cnt'); cnt.innerHTML = '';
  cnt.append(done + ' из ' + all);
  if(late){ const s = document.createElement('span'); s.className = 'late'; s.textContent = '  ·  просрочено ' + late; cnt.appendChild(s); }
  $('#bar').style.width = (all ? Math.round(done / all * 100) : 0) + '%';

  const box = $('#listbox'); box.innerHTML = '';
  let rows = o.tasks.filter(t => filter === 'all' || (filter === 'done') === !!t.done);
  if(byDue) rows = rows.slice().sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
  if(!rows.length){
    const e = document.createElement('div');
    e.className = 'empty'; e.innerHTML = '<b>Пусто</b>';
    e.append(filter === 'all' ? 'Нажмите + и впишите первую задачу.'
           : filter === 'done' ? 'Сделанного пока нет.' : 'Всё закрыто. Хорошая новость.');
    box.appendChild(e);
  } else {
    const ul = document.createElement('div'); ul.className = 'list';
    rows.forEach(t => ul.appendChild(taskEl(o, t)));
    box.appendChild(ul);
  }
  renderHist();
}
function renameObj(ob){
  const n = prompt('Новое название', ob.name);
  if(n && n.trim() && n.trim() !== ob.name) act('/api/object/' + ob.id, 'PATCH', { name:n.trim() }, 'Переименовано');
}

function duePill(t){
  const wrap = document.createElement('span');
  const n = daysLeft(t.due);
  let cls = 'duepill';
  if(!t.due) cls += ' empty';
  else if(!t.done && n < 0) cls += ' late';
  else if(!t.done && n <= 3) cls += ' soon';
  wrap.className = cls;
  wrap.innerHTML = SVG.cal;
  const lab = document.createElement('span'); lab.textContent = dueText(t.due);
  wrap.appendChild(lab);
  const inp = document.createElement('input');
  inp.type = 'date'; inp.value = t.due || ''; inp.setAttribute('aria-label', 'Срок');
  inp.onchange = () => act('/api/task/' + t.id, 'PATCH', { due:inp.value });
  inp.onclick = e => { e.stopPropagation(); try{ inp.showPicker && inp.showPicker(); }catch(err){} };
  wrap.appendChild(inp);
  return wrap;
}

function taskEl(o, t){
  const li = document.createElement('div');
  li.className = 'task' + (t.done ? ' done' : '') + (open.has(t.id) ? ' open' : '');

  const row = document.createElement('div'); row.className = 'trow';

  const chk = document.createElement('button');
  chk.className = 'check'; chk.innerHTML = SVG.check;
  chk.setAttribute('aria-label', t.done ? 'Вернуть в работу' : 'Отметить сделанным');
  chk.onclick = () => act('/api/task/' + t.id, 'PATCH', { done: !t.done });

  const mid = document.createElement('div'); mid.className = 'mid';
  const tw = document.createElement('div'); tw.className = 'titlewrap';
  const title = document.createElement('input');
  title.className = 'title'; title.type = 'text'; title.value = t.task;
  title.onchange = () => { if(title.value.trim() !== t.task) act('/api/task/' + t.id, 'PATCH', { task:title.value }); };
  tw.appendChild(title);

  const meta = document.createElement('div'); meta.className = 'meta';
  if(t.who){ const w = document.createElement('span'); w.className = 'who'; w.textContent = t.who; meta.appendChild(w); }
  meta.appendChild(duePill(t));
  if(t.files.length){
    const c = document.createElement('span'); c.className = 'clip';
    c.innerHTML = SVG.clip;
    const n = document.createElement('span'); n.textContent = t.files.length;
    c.appendChild(n); meta.appendChild(c);
  }
  if(t.by){
    const u = userOf(t.by);
    const sig = document.createElement('span'); sig.className = 'sig';
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = u ? u.color : '#AEAEB2';
    sig.append(dot, (u ? u.name : '?') + ', ' + when(t.at));
    meta.appendChild(sig);
  }
  tw.appendChild(meta);
  mid.appendChild(tw);

  const chev = document.createElement('button');
  chev.className = 'chev'; chev.innerHTML = SVG.chev;
  chev.setAttribute('aria-label', 'Подробности');
  chev.onclick = () => { if(open.has(t.id)) open.delete(t.id); else open.add(t.id); li.classList.toggle('open'); };

  row.append(chk, mid, chev);
  li.append(row, details(o, t));
  return li;
}

function details(o, t){
  const d = document.createElement('div'); d.className = 'det';
  const cols = document.createElement('div'); cols.className = 'cols';

  const left = document.createElement('div');
  const h0 = document.createElement('h4'); h0.textContent = 'Исполнитель';
  const who = document.createElement('input');
  who.className = 'field'; who.type = 'text'; who.value = t.who || ''; who.placeholder = 'Кто делает';
  who.onchange = () => { if(who.value.trim() !== t.who) act('/api/task/' + t.id, 'PATCH', { who:who.value }); };
  const h1 = document.createElement('h4'); h1.textContent = 'Заметка';
  const ta = document.createElement('textarea');
  ta.className = 'field'; ta.value = t.note || '';
  ta.placeholder = 'Телефон, счёт, о чём договорились';
  ta.onchange = () => { if(ta.value.trim() !== t.note) act('/api/task/' + t.id, 'PATCH', { note:ta.value }, 'Заметка сохранена'); };
  left.append(h0, who, h1, ta);

  const right = document.createElement('div');
  const h2 = document.createElement('h4'); h2.textContent = 'Файлы';
  const files = document.createElement('div'); files.className = 'files';
  t.files.forEach(f => {
    const chip = document.createElement('div'); chip.className = 'file';
    const ic = document.createElement('div'); ic.className = 'ic'; ic.innerHTML = SVG.doc;
    const fi = document.createElement('div'); fi.className = 'fi';
    const a = document.createElement('a'); a.href = '/files/' + f.stored; a.target = '_blank'; a.rel = 'noopener'; a.textContent = f.name;
    const u = userOf(f.by);
    const em = document.createElement('em'); em.textContent = kb(f.size) + (u ? ' · ' + u.name : '');
    fi.append(a, em);
    const x = document.createElement('button'); x.innerHTML = SVG.x; x.setAttribute('aria-label', 'Убрать файл');
    x.onclick = () => { if(confirm('Убрать «' + f.name + '»?')) act('/api/task/' + t.id + '/file/' + f.id, 'DELETE', null, 'Файл убран'); };
    chip.append(ic, fi, x); files.appendChild(chip);
  });

  const drop = document.createElement('button'); drop.className = 'drop';
  const setLabel = () => { drop.innerHTML = SVG.clip; drop.append('Прикрепить файл'); };
  setLabel();
  const input = document.createElement('input'); input.type = 'file'; input.multiple = true; input.hidden = true;
  const take = async list => {
    for(const f of list){
      if(f.size > 15 * 1024 * 1024){ toast('«' + f.name + '» больше 15 МБ', true); continue; }
      drop.textContent = 'Загружаю…';
      try{
        const b64 = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.onerror = () => rej(new Error('Файл не читается'));
          r.readAsDataURL(f);
        });
        open.add(t.id);
        S = await api('/api/task/' + t.id + '/file', 'POST', { name:f.name, type:f.type, data:b64 });
        render(); toast('Файл приложен'); return;
      }catch(e){ toast(e.message, true); }
    }
    setLabel(); input.value = '';
  };
  drop.onclick = () => input.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('hot'); };
  drop.ondragleave = () => drop.classList.remove('hot');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('hot'); take(e.dataTransfer.files); };
  input.onchange = () => take(input.files);
  right.append(h2, files, drop, input);

  cols.append(left, right);
  const del = document.createElement('button');
  del.className = 'danger'; del.textContent = 'Удалить задачу';
  del.onclick = () => { if(confirm('Удалить «' + (t.task || 'без названия') + '»?')){ open.delete(t.id); act('/api/task/' + t.id, 'DELETE', null, 'Удалено'); } };
  d.append(cols, del);
  return d;
}

/* ---------- история ---------- */
function renderHist(){
  const box = $('#histlist'); box.innerHTML = '';
  if(!S.log.length){
    const e = document.createElement('div'); e.className = 'empty';
    e.innerHTML = '<b>Пока пусто</b>'; e.append('Здесь появится, кто что менял.');
    box.appendChild(e); return;
  }
  S.log.forEach(l => {
    const u = userOf(l.by);
    const row = document.createElement('div'); row.className = 'entry';
    const c = document.createElement('div');
    const dt = new Date(l.at);
    const time = document.createElement('time');
    time.textContent = dt.getDate() + ' ' + MON[dt.getMonth()] + ', ' +
      String(dt.getHours()).padStart(2,'0') + ':' + String(dt.getMinutes()).padStart(2,'0');
    const p = document.createElement('p');
    const b = document.createElement('b'); b.textContent = (u ? u.name : 'кто-то') + ' ';
    p.append(b, l.text);
    c.append(time, p);
    row.append(ava(u, 26), c);
    box.appendChild(row);
  });
}
const histOpen = on => { $('#hist').classList.toggle('on', on); $('#veil').classList.toggle('on', on && window.innerWidth > 500); };
$('#open-hist').onclick = () => histOpen(true);
$('#close-hist').onclick = () => histOpen(false);
$('#veil').onclick = () => { histOpen(false); sheetOpen(false); };
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ histOpen(false); sheetOpen(false); } });
$('#me-btn').onclick = () => S && toast('Вы вошли как ' + S.me.name);

/* ---------- добавление ---------- */
const mobile = () => window.matchMedia('(max-width:759px)').matches;
function sheetOpen(on){
  if(!mobile()) return;
  $('#sheet').classList.toggle('on', on);
  $('#veil').classList.toggle('on', on);
  if(on) setTimeout(() => $('#f-task').focus(), 250);
}
$('#fab').onclick = () => sheetOpen(true);
$('#close-sheet').onclick = () => sheetOpen(false);
$('#add').onclick = () => {
  const title = $('#f-task').value.trim();
  if(!title){ $('#f-task').focus(); return; }
  const payload = { objectId: cur().id, task:title, who:$('#f-who').value.trim(), due:$('#f-due').value };
  $('#f-task').value = $('#f-who').value = $('#f-due').value = '';
  sheetOpen(false);
  act('/api/task', 'POST', payload, 'Задача добавлена');
};
['f-task','f-who','f-due'].forEach(id =>
  $('#' + id).addEventListener('keydown', e => { if(e.key === 'Enter') $('#add').click(); }));

document.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
$('#sort').onclick = () => { byDue = !byDue; $('#sort').classList.toggle('on', byDue); render(); };
$('#drop-obj').onclick = () => {
  const o = cur();
  if(S.objects.length < 2){ toast('Последний объект удалить нельзя', true); return; }
  if(confirm('Удалить объект «' + o.name + '» вместе со всеми задачами?'))
    act('/api/object/' + o.id, 'DELETE', null, 'Объект удалён');
};
$('#backup').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ objects:S.objects, log:S.log }, null, 2)], { type:'application/json' }));
  a.download = 'zhurnal-rabot-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
};

/* ---------- запуск ---------- */
async function boot(){
  const keep = S && S.activeId;
  S = await api('/api/state');
  S.activeId = keep || localStorage.getItem('tab') || S.objects[0].id;
  render();
}
setInterval(async () => {
  if(!S || $('#gate').classList.contains('on') || $('#sheet').classList.contains('on')) return;
  const el = document.activeElement;
  if(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
  try{
    const fresh = await api('/api/state');
    if(fresh.rev !== S.rev){ const keep = S.activeId; S = fresh; S.activeId = keep; render(); toast('Появились новые правки'); }
  }catch(e){}
}, 15000);

buildGate();
boot().catch(() => showGate());
</script>
</body>
</html>
